<!-- Add script to fetch cover data -->
<script type="text/javascript">
  var coverData = null;
  
  // Fetch cover data from the database
  function fetchCoverData(template, slot) {
    // Default values
    template = template || 1;
    slot = slot || 1;
    
    $.ajax({
      url: '../../Connection/YearbookCover/FetchCoverData.php',
      method: 'GET',
      data: { template: template, slot: slot },
      dataType: 'json',
      success: function(response) {
        if (response.success) {
          coverData = response.data;
          console.log("Cover data loaded:", coverData);
          
          // Populate thumbnails with the fetched data
          populateThumbnails();
          
          // Re-initialize the magazine after loading cover data
          if (typeof loadApp === 'function') {
            loadApp();
          }
        } else {
          console.error("Failed to fetch covers:", response.message);
        }
      },
      error: function(xhr, status, error) {
        console.error("AJAX error:", error);
        console.error("Response:", xhr.responseText);
      }
    });
  }
  
  // Function to populate thumbnails
  function populateThumbnails() {
    if (!coverData) return;
    
    var thumbnailList = $('#thumbnail-list');
    thumbnailList.empty();
    
    // First page thumbnail (front cover)
    var firstPageLi = $('<li class="i"></li>');
    var firstPageImg = $('<img>').attr({
      src: coverData.front_thumb_url,
      width: 76,
      height: 100,
      class: 'page-1'
    });
    var firstPageSpan = $('<span>1</span>');
    firstPageLi.append(firstPageImg).append(firstPageSpan);
    thumbnailList.append(firstPageLi);
    
    // Middle pages thumbnails (pages 2-11)
    for (var i = 2; i <= 11; i += 2) {
      var li = $('<li class="d"></li>');
      var img1 = $('<img>').attr({
        src: 'pages/' + i + '-thumb.jpg',
        width: 76,
        height: 100,
        class: 'page-' + i
      });
      var img2 = $('<img>').attr({
        src: 'pages/' + (i + 1) + '-thumb.jpg',
        width: 76,
        height: 100,
        class: 'page-' + (i + 1)
      });
      var span = $('<span>' + i + '-' + (i + 1) + '</span>');
      li.append(img1).append(img2).append(span);
      thumbnailList.append(li);
    }
    
    // Last page thumbnail (back cover)
    var lastPageLi = $('<li class="i"></li>');
    var lastPageImg = $('<img>').attr({
      src: coverData.back_thumb_url,
      width: 76,
      height: 100,
      class: 'page-12'
    });
    var lastPageSpan = $('<span>12</span>');
    lastPageLi.append(lastPageImg).append(lastPageSpan);
    thumbnailList.append(lastPageLi);
    
    // Reattach event handlers for thumbnails
    $('.thumbnails').off('click').on('click', function(event) {
      var page;
      if (event.target && (page=/page-([0-9]+)/.exec($(event.target).attr('class'))) ) {
        $('.magazine').turn('page', page[1]);
      }
    });

    $('.thumbnails li').
      off($.mouseEvents.over).
      off($.mouseEvents.out).
      on($.mouseEvents.over, function() {
        $(this).addClass('thumb-hover');
      }).on($.mouseEvents.out, function() {
        $(this).removeClass('thumb-hover');
      });
  }
</script>

<div id="canvas">

<script type="text/javascript">

// Fetch cover data when page loads
$(document).ready(function() {
  // For now, we'll use template 1 and slot 1 as default
  // In a real implementation, these could be passed as URL parameters
  fetchCoverData(1, 1);
});

function loadApp() {
  // Only proceed if cover data has been loaded
  if (!coverData) {
    console.log("Waiting for cover data to load...");
    setTimeout(loadApp, 100);
    return;
  }

 	$('#canvas').fadeIn(1000);

 	var flipbook = $('.magazine');
	
	if (flipbook.width()==0 || flipbook.height()==0) {
		setTimeout(loadApp, 10);
		return;
	}

	flipbook.turn({

			width: 922,

			height: 600,

			duration: 1000,

			acceleration: true,

			gradients: false,

			autoCenter: true,

			elevation: 50,

			pages: 12,

			when: {
				turning: function(event, page, view) {
					
					var book = $(this),
					currentPage = book.turn('page'),
					pages = book.turn('pages');

					Hash.go('page/' + page).update();

					disableControls(page);

					$('.thumbnails .page-'+currentPage).
						parent().
						removeClass('current');

					$('.thumbnails .page-'+page).
						parent().
						addClass('current');

				},

				turned: function(event, page, view) {

					disableControls(page);

					$(this).turn('center');

				},

				missing: function (event, pages) {

					for (var i = 0; i < pages.length; i++)
						addPage(pages[i], $(this));

				}
			}

	});

	$('.magazine-viewport').zoom({
		flipbook: $('.magazine'),

		max: function() { 
			
			return largeMagazineWidth()/$('.magazine').width();

		}, 

		when: {

			swipeLeft: function() {

				$(this).zoom('flipbook').turn('next');

			},

			swipeRight: function() {
				
				$(this).zoom('flipbook').turn('previous');

			},

			resize: function(event, scale, page, pageElement) {

				if (scale==1)
					loadSmallPage(page, pageElement);
				else
					loadLargePage(page, pageElement);

			},

			zoomIn: function () {

				$('.thumbnails').hide();
				$('.made').hide();
				$('.magazine').removeClass('animated').addClass('zoom-in');
				$('.zoom-icon').removeClass('zoom-icon-in').addClass('zoom-icon-out');
				
				if (!window.escTip && !$.isTouch) {
					escTip = true;

					$('<div />', {'class': 'exit-message'}).
						html('<div>Press ESC to exit</div>').
							appendTo($('body')).
							delay(2000).
							animate({opacity:0}, 500, function() {
								$(this).remove();
							});
				}
			},

			zoomOut: function () {

				$('.exit-message').hide();
				$('.thumbnails').fadeIn();
				$('.made').fadeIn();
				$('.zoom-icon').removeClass('zoom-icon-out').addClass('zoom-icon-in');

				setTimeout(function(){
					$('.magazine').addClass('animated').removeClass('zoom-in');
					resizeViewport();
				}, 0);

			}
		}
	});

	if ($.isTouch)
		$('.magazine-viewport').on('zoom.doubleTap', zoomTo);
	else
		$('.magazine-viewport').on('zoom.tap', zoomTo);

	$(document).on('keydown',function(e){

		var previous = 37, next = 39, esc = 27;

		switch (e.keyCode) {
			case previous:
				$('.magazine').turn('previous');
				e.preventDefault();

			break;
			case next:
				$('.magazine').turn('next');
				e.preventDefault();

			break;
			case esc:
				
				$('.magazine-viewport').zoom('zoomOut');	
				e.preventDefault();

			break;
		}
	});

	Hash.on('^page\/([0-9]*)$', {
		yep: function(path, parts) {
			var page = parts[1];

			if (page!==undefined) {
				if ($('.magazine').turn('is'))
					$('.magazine').turn('page', page);
			}

		},
		nop: function(path) {

			if ($('.magazine').turn('is'))
				$('.magazine').turn('page', 1);
		}
	});


	$(window).on('resize',function() {
		resizeViewport();
	}).on('orientationchange', function() {
		resizeViewport();
	});

	// Initialize thumbnail event handlers
	$('.thumbnails').on('click', function(event) {
		
		var page;

		if (event.target && (page=/page-([0-9]+)/.exec($(event.target).attr('class'))) ) {
		
			$('.magazine').turn('page', page[1]);
		}
	});

	$('.thumbnails li').
		on($.mouseEvents.over, function() {
			
			$(this).addClass('thumb-hover');

		}).on($.mouseEvents.out, function() {
			
			$(this).removeClass('thumb-hover');

		});

	if ($.isTouch) {
	
		$('.thumbnails').
			addClass('thumbanils-touch').
			on($.mouseEvents.move, function(event) {
				event.preventDefault();
			});

	} else {

		$('.thumbnails ul').on('mouseover', function() {

			$('.thumbnails').addClass('thumbnails-hover');

		}).on('mousedown',function() {

			return false;

		}).on('mouseout',function() {

			$('.thumbnails').removeClass('thumbnails-hover');

		});

	}

	$('.next-button').on($.mouseEvents.over, function() {
		
		$(this).addClass('next-button-hover');

	}).on($.mouseEvents.out, function() {
		
		$(this).removeClass('next-button-hover');

	}).on($.mouseEvents.down, function() {
		
		$(this).addClass('next-button-down');

	}).on($.mouseEvents.up, function() {
		
		$(this).removeClass('next-button-down');

	}).on('click', function() {
		
		$('.magazine').turn('next');

	});
	
	$('.previous-button').on($.mouseEvents.over, function() {
		
		$(this).addClass('previous-button-hover');

	}).on($.mouseEvents.out, function() {
		
		$(this).removeClass('previous-button-hover');

	}).on($.mouseEvents.down, function() {
		
		$(this).addClass('previous-button-down');

	}).on($.mouseEvents.up, function() {
		
		$(this).removeClass('previous-button-down');

	}).on('click', function() {
		
		$('.magazine').turn('previous');

	});


	resizeViewport();

	$('.magazine').addClass('animated');
}

 $('.zoom-icon').on('mouseover', function() { 
 	
 	if ($(this).hasClass('zoom-icon-in'))
 		$(this).addClass('zoom-icon-in-hover');

 	if ($(this).hasClass('zoom-icon-out'))
 		$(this).addClass('zoom-icon-out-hover');
 
 }).on('mouseout', function() { 
 	
 	 if ($(this).hasClass('zoom-icon-in'))
 		$(this).removeClass('zoom-icon-in-hover');
 	
 	if ($(this).hasClass('zoom-icon-out'))
 		$(this).removeClass('zoom-icon-out-hover');

 }).on('click', function() {

	if (!document.fullscreenElement) {
		document.documentElement.requestFullscreen().catch((err) => {
			console.log("Error attempting to enable fullscreen:", err);
		});
		} else {
		document.exitFullscreen();
	}
 });

 $('#canvas').hide();

// Load the app after cover data is fetched
// loadApp() is now called from fetchCoverData when data is ready

// Add hover detection for thumbnails
$(document).ready(function() {
  var thumbnails = $('.thumbnails');
  var hoverTimer;
  
  // Detect mouse movement at the bottom of the page
  $(document).on('mousemove', function(e) {
    var windowHeight = $(window).height();
    var mouseY = e.clientY;
    
    // If mouse is near the bottom (within 150px of the bottom)
    if (mouseY > windowHeight - 150) {
      // Clear any existing timer
      clearTimeout(hoverTimer);
      
      // Show thumbnails with a slight delay for better UX
      setTimeout(function() {
        thumbnails.addClass('visible');
      }, 100);
      
      // Set timer to hide thumbnails after 3 seconds of no movement
      hoverTimer = setTimeout(function() {
        thumbnails.removeClass('visible');
      }, 3000);
    }
  });
  
  // Also show thumbnails when hovering directly over them
  thumbnails.on('mouseenter', function() {
    clearTimeout(hoverTimer);
    thumbnails.addClass('visible');
  });
  
  thumbnails.on('mouseleave', function() {
    hoverTimer = setTimeout(function() {
      thumbnails.removeClass('visible');
    }, 1000);
  });
});

</script>
