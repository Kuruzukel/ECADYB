<!DOCTYPE html>
<html>
<head>
    <title>Top Management Test</title>
</head>
<body>
    <h1>Top Management API Test</h1>
    <div id="results"></div>
    
    <script>
        function testTopManagementAPI() {
            const template = 1;
            const batchYear = "Batch Year 2024-2025";
            
            console.log("Testing Top Management API...");
            console.log("Template:", template);
            console.log("Batch Year:", batchYear);
            
            const url = `/ECADYB/Connection/Photos/FetchTopManagement.php?template=${template}&batch_year=${encodeURIComponent(batchYear)}`;
            console.log("Request URL:", url);
            
            fetch(url)
                .then(response => {
                    console.log("Response status:", response.status);
                    console.log("Response headers:", response.headers);
                    return response.text();
                })
                .then(text => {
                    console.log("Response text:", text);
                    try {
                        const data = JSON.parse(text);
                        console.log("Parsed JSON:", data);
                        
                        document.getElementById('results').innerHTML = `
                            <h2>API Response:</h2>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    } catch (e) {
                        console.error("JSON parse error:", e);
                        document.getElementById('results').innerHTML = `
                            <h2>Error:</h2>
                            <p>Failed to parse JSON response</p>
                            <pre>${text}</pre>
                        `;
                    }
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    document.getElementById('results').innerHTML = `
                        <h2>Error:</h2>
                        <p>${error.message}</p>
                    `;
                });
        }
        
        // Run test when page loads
        window.onload = testTopManagementAPI;
    </script>
</body>
</html>
