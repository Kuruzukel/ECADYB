<!DOCTYPE html>
<html>
<head>
    <title>Test Cancellation</title>
</head>
<body>
    <h1>Test Upload Cancellation</h1>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="file" required>
        <br><br>
        <button type="submit">Upload</button>
        <button type="button" id="cancelBtn">Cancel Upload</button>
    </form>
    <div id="result"></div>

    <script>
        let currentXhr = null;

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                document.getElementById('result').innerHTML = 'Please select a file';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('slot', '1');
            formData.append('side', 'front');
            formData.append('template', '1');
            
            currentXhr = new XMLHttpRequest();
            
            currentXhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    document.getElementById('result').innerHTML = `Uploading... ${Math.round(percentComplete)}%`;
                }
            });
            
            currentXhr.onreadystatechange = function() {
                if (currentXhr.readyState === 4) {
                    if (currentXhr.status === 0) {
                        document.getElementById('result').innerHTML = 'Upload cancelled';
                    } else if (currentXhr.status >= 200 && currentXhr.status < 300) {
                        try {
                            const response = JSON.parse(currentXhr.responseText);
                            document.getElementById('result').innerHTML = response.message || 'Upload completed';
                        } catch (e) {
                            document.getElementById('result').innerHTML = 'Upload completed';
                        }
                    } else {
                        document.getElementById('result').innerHTML = `Error: ${currentXhr.status}`;
                    }
                }
            };
            
            currentXhr.open('POST', 'Connection/Cover/UploadCover.php', true);
            currentXhr.send(formData);
            
            document.getElementById('result').innerHTML = 'Upload started...';
        });
        
        document.getElementById('cancelBtn').addEventListener('click', function() {
            if (currentXhr) {
                currentXhr.abort();
                document.getElementById('result').innerHTML = 'Upload cancelled';
                currentXhr = null;
            } else {
                document.getElementById('result').innerHTML = 'No upload in progress';
            }
        });
    </script>
</body>
</html>
