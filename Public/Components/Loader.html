<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loader</title>
    <link rel="stylesheet" href="/Public/assets/css/Loader.css" />
  </head>
  <body>
    <!-- Hero Section -->
    <section class="main-hero" id="main-hero">
      <div class="main_blur_overlay"></div>
      <div class="main-hero-background"></div>
      <div class="main-hero-text">
        <div class="logo-container">
          <img src="/img/ADMINGRALLERYLOGO.png" alt="Logo" class="logo-img" />
        </div>
        <div class="hero-message">
          <div>
            Welcome to the Exact Colleges of Asia Digital Yearbook Grallery.
          </div>
        </div>
        <div class="loader">
          <div class="loading-text">
            Loading<span class="dot">.</span><span class="dot">.</span
            ><span class="dot">.</span>
          </div>
          <div class="loading-bar-background">
            <div class="loading-bar">
              <div class="white-bars-container">
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
                <div class="white-bar"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Lower Curl SVG Divider -->
      <iframe id="preload-frame" src="/LandingPage/LandingPage.html" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; border:0;" loading="eager"></iframe>
      <div class="main-hero-lower-curl">
        <svg
          viewBox="0 0 1440 120"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="none"
          style="display: block; width: 100%; height: 60px"
        >
          <!-- Back wave -->
          <path
            d="M0,60 Q180,100 360,60 T720,60 T1080,60 T1440,60 L1440,120 L0,120 Z"
            fill="#1a237e"
            opacity="0.4"
          />
          <!-- Middle wave -->
          <path
            d="M0,80 Q180,40 360,80 T720,80 T1080,80 T1440,80 L1440,120 L0,120 Z"
            fill="#112d4e"
            opacity="0.7"
          />
          <!-- Front wave -->
          <path
            d="M0,100 Q180,60 360,100 T720,100 T1080,100 T1440,100 L1440,120 L0,120 Z"
            fill="#021326"
          />
        </svg>
      </div>
    </section>
    <script>
      (function () {
        const iframe = document.getElementById('preload-frame');
        function allImagesLoaded(doc) {
          const imgs = Array.from(doc ? doc.images : []);
          if (imgs.length === 0) return true;
          return imgs.every((img) => img.complete && img.naturalWidth > 0);
        }
        function tryRedirect() {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (doc && allImagesLoaded(doc)) {
              window.location.replace('/landing');
            }
          } catch (_) {}
        }
        iframe.addEventListener('load', () => {
          tryRedirect();
          const interval = setInterval(tryRedirect, 300);
          setTimeout(() => {
            clearInterval(interval);
            window.location.replace('/landing');
          }, 10000);
        });
      })();
    </script>
  </body>
</html>
