<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="/Public/assets/css/Loader.css">
    <style>
        /* Hide the page content initially */
        #content {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loader Container -->
    <div id="loader"></div>
    
    <!-- Main Content (will be hidden until loaded) -->
    <div id="content">
        <!-- Your landing page will be loaded here -->
        <iframe id="preload-frame" src="/LandingPage/LandingPage.html" style="display: none;"></iframe>
    </div>
    
    <!-- Load the JavaScript -->
    <script src="/Public/assets/js/Loader.js"></script>
</body>
</html>
