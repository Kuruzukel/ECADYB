; PHP Configuration for Railway Deployment
; This file ensures proper settings for file uploads and web applications

; File upload settings
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Error reporting (disable in production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /tmp/php_errors.log

; Session settings
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0
session.use_strict_mode = 1

; Security settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Date settings
date.timezone = UTC

; Output buffering
output_buffering = 4096
implicit_flush = Off

; CURL settings
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
